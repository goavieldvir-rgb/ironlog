name: Database structure snapshot

# Keeps supabase/schema.sql (and supabase/platform.sql) an exact copy of the
# live database's structure: tables, access rules, functions, triggers,
# indexes and scheduled jobs. No trainee data is read or saved.
#
# - Every Monday, and whenever run by hand from the Actions tab, it compares
#   the live database with the repo. If someone changed the database without
#   a migration, the run fails and GitHub emails the repo owner.
# - On a pull request that changes this file, it refreshes the snapshot on
#   that pull request's branch.
#
# Uses the same SUPABASE_DB_URL secret as the nightly backup.

on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * 1' # Mondays 01:30 UTC
  pull_request:
    paths: ['.github/workflows/db-snapshot.yml']

permissions:
  contents: write

concurrency:
  group: db-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      # Same clean-up as the backup: a password with symbols must not break the link.
      - name: Tidy the connection link
        env:
          RAW_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python3 - <<'PY'
          import os, sys, urllib.parse as u
          raw = os.environ['RAW_URL'].strip().strip('"').strip("'")
          scheme, sep, rest = raw.partition('://')
          if not sep or '@' not in rest:
              sys.exit('SUPABASE_DB_URL is not a postgresql:// link with a password (see docs/backups.md)')
          userinfo, host = rest.rsplit('@', 1)
          user, _, pw = userinfo.partition(':')
          if pw.startswith('[') and pw.endswith(']'):
              pw = pw[1:-1]
          pw = u.quote(u.unquote(pw), safe='')
          url = f'{scheme}://{user}:{pw}@{host}'
          print(f'::add-mask::{pw}')
          print(f'::add-mask::{url}')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'DB_URL={url}\n')
          PY

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Snapshot the live structure
        run: |
          supabase db dump --db-url "$DB_URL" -f supabase/schema.sql
          # What that dump leaves out: the photo storage bucket and its access
          # rules, the sign-up trigger on auth.users, and the scheduled jobs.
          {
            echo '-- Live database settings outside the public schema: storage bucket and'
            echo '-- its access rules, sign-up trigger, scheduled jobs (pg_cron).'
            echo '-- Generated by .github/workflows/db-snapshot.yml. Do not edit by hand.'
            PGOPTIONS='-c search_path=' psql "$DB_URL" -v ON_ERROR_STOP=1 -At -f - <<'SQL'
          select line from (
            select 1 o, b.id k, format('insert into storage.buckets (id, name, public, file_size_limit, allowed_mime_types) values (%L, %L, %L, %s, %L) on conflict (id) do nothing;', b.id, b.name, b.public, coalesce(b.file_size_limit::text, 'null'), b.allowed_mime_types) line from storage.buckets b
            union all
            select 2, policyname, format('create policy %I on %I.%I as %s for %s to %s%s%s;', policyname, schemaname, tablename, permissive, cmd, array_to_string(roles, ', '), coalesce(' using (' || qual || ')', ''), coalesce(' with check (' || with_check || ')', '')) from pg_policies where schemaname = 'storage'
            union all
            select 3, t.tgname, pg_get_triggerdef(t.oid) || ';' from pg_trigger t join pg_class c on c.oid = t.tgrelid join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'auth' and not t.tgisinternal
            union all
            select 4, jobname, format('select cron.schedule(%L, %L, %L);', jobname, schedule, command) from cron.job
          ) x order by o, k;
          SQL
          } > supabase/platform.sql
          test -s supabase/schema.sql

      - name: Compare with the repo
        run: |
          if [ -z "$(git status --porcelain -- supabase/schema.sql supabase/platform.sql)" ]; then
            echo "The live database matches the repo."
            exit 0
          fi
          git status --short -- supabase/schema.sql supabase/platform.sql
          git --no-pager diff --stat -- supabase/schema.sql supabase/platform.sql
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add supabase/schema.sql supabase/platform.sql
            git commit -m "Refresh the live database structure snapshot"
            git push
          else
            echo "::error::The live database differs from supabase/schema.sql. Someone changed it outside a migration. See supabase/README.md."
            exit 1
          fi
