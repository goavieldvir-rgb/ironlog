name: Nightly database backup

# Every night, an encrypted copy of the whole database (structure, data and
# the people who can sign in) is saved to this repository's Actions tab and
# kept for 30 days. See docs/backups.md for how to restore one.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_DB_URL     the database's "Session pooler" connection string
#   BACKUP_PASSPHRASE   a long password that locks the backup files

on:
  schedule:
    - cron: '0 1 * * *' # 01:00 UTC, about 3-4 AM in Israel
  workflow_dispatch: # lets you run it by hand from the Actions tab
  pull_request: # a pull request that changes this file tests it before merging
    paths: ['.github/workflows/backup.yml']

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the secrets are set
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Add the SUPABASE_DB_URL and BACKUP_PASSPHRASE secrets (see docs/backups.md)."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0 # pinned: "latest" needs a GitHub API lookup that can be rate-limited

      # The secret is the link copied from Supabase with the password typed in.
      # Passwords with symbols (/ # ? @ %) or leftover [ ] brackets would break
      # that link, so the password part is cleaned up and encoded here.
      - name: Tidy the connection link
        env:
          RAW_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python3 - <<'PY'
          import os, sys, urllib.parse as u
          raw = os.environ['RAW_URL'].strip().strip('"').strip("'")
          scheme, sep, rest = raw.partition('://')
          if not sep or '@' not in rest:
              sys.exit('SUPABASE_DB_URL is not a postgresql:// link with a password (see docs/backups.md)')
          userinfo, host = rest.rsplit('@', 1)  # the last @ starts the server address
          user, _, pw = userinfo.partition(':')
          if pw.startswith('[') and pw.endswith(']'):
              pw = pw[1:-1]
          pw = u.quote(u.unquote(pw), safe='')
          url = f'{scheme}://{user}:{pw}@{host}'
          print(f'::add-mask::{pw}')  # never show it in the log
          print(f'::add-mask::{url}')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'DB_URL={url}\n')
          PY

      # Supabase's own recommended way to back up a project: three files.
      - name: Dump the database
        run: |
          SUPABASE_DB_URL="$DB_URL"
          mkdir -p backup
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/data.sql --use-copy --data-only \
            -x cron.job_run_details -x net._http_response
          ls -l backup
          # A backup with no data is a failed backup.
          test -s backup/schema.sql && test -s backup/data.sql

      # The files hold trainees' personal data, so they are locked with the
      # passphrase before they leave this machine.
      - name: Lock the backup with the passphrase
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          name="ironlog-db-$(date -u +%Y-%m-%d)"
          tar -czf "$name.tar.gz" -C backup .
          gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSPHRASE" -o "$name.tar.gz.gpg" "$name.tar.gz"
          # Prove the locked file opens with the passphrase and holds all three files.
          gpg --batch --quiet --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --decrypt "$name.tar.gz.gpg" | tar -tzf - | tee contents.txt
          for f in roles.sql schema.sql data.sql; do grep -q "$f" contents.txt; done
          rm -rf backup "$name.tar.gz" contents.txt
          echo "NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.tar.gz.gpg
          retention-days: 30
          if-no-files-found: error
