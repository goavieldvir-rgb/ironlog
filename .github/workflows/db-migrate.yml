name: Database migrations

# Applies new files in supabase/migrations/ to the live database.
# - On a pull request: lists which migrations would run, changes nothing.
# - On merge to main: runs them, in order, and records each one in Supabase so
#   it never runs twice.
# Uses the same SUPABASE_DB_URL secret as the nightly backup.

on:
  pull_request:
    paths: ['supabase/migrations/**', '.github/workflows/db-migrate.yml']
  push:
    branches: [main]
    paths: ['supabase/migrations/**', '.github/workflows/db-migrate.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  # Proves the migrations folder can build a brand-new database from nothing:
  # starts an empty local Supabase database and applies every migration.
  rebuild-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0 # pinned: "latest" needs a GitHub API lookup that can be rate-limited
      - name: Build an empty database from the migrations
        run: supabase db start

  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Tidy the connection link
        env:
          RAW_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python3 - <<'PY'
          import os, sys, urllib.parse as u
          raw = os.environ['RAW_URL'].strip().strip('"').strip("'")
          scheme, sep, rest = raw.partition('://')
          if not sep or '@' not in rest:
              sys.exit('SUPABASE_DB_URL is not a postgresql:// link with a password (see docs/backups.md)')
          userinfo, host = rest.rsplit('@', 1)
          user, _, pw = userinfo.partition(':')
          if pw.startswith('[') and pw.endswith(']'):
              pw = pw[1:-1]
          pw = u.quote(u.unquote(pw), safe='')
          url = f'{scheme}://{user}:{pw}@{host}'
          print(f'::add-mask::{pw}')
          print(f'::add-mask::{url}')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'DB_URL={url}\n')
          PY

      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0 # pinned: "latest" needs a GitHub API lookup that can be rate-limited

      - name: Migrations already on the live database vs. in this branch
        run: supabase migration list --db-url "$DB_URL"

      - name: What would run (no changes)
        if: github.event_name == 'pull_request'
        run: supabase db push --db-url "$DB_URL" --dry-run

      - name: Apply to the live database
        # Only ever from main: a manual run started on another branch stops here.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        # --yes: nobody is there to answer "apply?" in a workflow run; without
        # it the CLI stops and changes nothing. Merging was the approval.
        run: supabase db push --db-url "$DB_URL" --yes
