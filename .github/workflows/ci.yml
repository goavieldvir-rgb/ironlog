name: Check

# Runs on every pull request, before anything is merged and deployed:
# if the app no longer builds, the pull request shows a red X.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Placeholder values: this only checks that the app builds. Nothing
      # built here is published or talks to the real database.
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test the reminder function's helpers
        run: deno test supabase/functions/send-workout-reminders/helpers.test.ts
