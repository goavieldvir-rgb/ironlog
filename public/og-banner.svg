<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14161A"/>
      <stop offset="1" stop-color="#1C1F26"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- faint weight-plate rings, corner accents -->
  <circle cx="1080" cy="120" r="150" fill="none" stroke="#31353E" stroke-width="2"/>
  <circle cx="1080" cy="120" r="110" fill="none" stroke="#31353E" stroke-width="2"/>
  <circle cx="120" cy="540" r="150" fill="none" stroke="#31353E" stroke-width="2"/>
  <circle cx="120" cy="540" r="110" fill="none" stroke="#31353E" stroke-width="2"/>

  <!-- barbell icon -->
  <g transform="translate(90,90)" stroke="#D64545" stroke-width="10" stroke-linecap="round">
    <line x1="0" y1="30" x2="120" y2="30"/>
    <line x1="8" y1="8" x2="8" y2="52"/>
    <line x1="26" y1="0" x2="26" y2="60"/>
  </g>

  <!-- eyebrow -->
  <text x="90" y="270" font-family="'Courier New', monospace" font-size="26" letter-spacing="8" fill="#9CA0AA">IRONLOG</text>

  <!-- wordmark -->
  <text x="86" y="380" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="120" fill="#EDEDE6" letter-spacing="-2">Train. Log.</text>
  <text x="86" y="470" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="120" fill="#EDEDE6" letter-spacing="-2">Progress.</text>

  <!-- accent rule -->
  <rect x="90" y="510" width="90" height="8" fill="#D64545"/>

  <!-- tagline -->
  <text x="90" y="565" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#9CA0AA">Your private strength &amp; mobility training log.</text>
</svg>
