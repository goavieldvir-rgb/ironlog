<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0B0B0C" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Ironlog — Training Log</title>
    <meta name="description" content="Personal strength and mobility training log." />

    <!-- Link preview (WhatsApp, iMessage, Slack, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://goavieldvir-rgb.github.io/ironlog/" />
    <meta property="og:title" content="Ironlog — Training Log" />
    <meta property="og:description" content="Your private strength & mobility training log. Build routines, log sets and reps, track your progress." />
    <meta property="og:image" content="https://goavieldvir-rgb.github.io/ironlog/og-banner.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ironlog — Training Log" />
    <meta name="twitter:description" content="Your private strength & mobility training log." />
    <meta name="twitter:image" content="https://goavieldvir-rgb.github.io/ironlog/og-banner.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Launch screen. Lives in the page itself so it is on screen from the
         first paint, before any script arrives; src/lib/splash.js takes it
         down once the app has something real to show. The same classes draw
         the in-app loaders (src/components/Loading.jsx).

         The mark assembles the way a bar is loaded: the bar, then the inner
         plates, then the outer ones. While the wait goes on a light passes
         across it, the only thing that moves. Plain CSS on purpose: it has
         to run before any JavaScript has downloaded. -->
    <style>
      html, body { margin: 0; background: #0B0B0C; }
      .il-splash {
        position: fixed; inset: 0; z-index: 100;
        display: flex; align-items: center; justify-content: center;
        background: #0B0B0C;
        transition: opacity 200ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      .il-splash.is-out { opacity: 0; pointer-events: none; }
      .il-splash.is-out .il-loader {
        transform: scale(0.97); filter: blur(4px);
        transition: transform 200ms cubic-bezier(0.23, 1, 0.32, 1), filter 200ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      .il-loader {
        display: flex; flex-direction: column; align-items: center; gap: 28px;
      }
      .il-logo { display: flex; flex-direction: column; align-items: center; gap: 18px; }
      .il-logo svg { display: block; width: 76px; height: auto; overflow: visible; }
      .il-logo svg * { transform-box: fill-box; transform-origin: center; }
      .il-word {
        color: #F2F2EF; direction: ltr;
        font: 600 20px/1 Geist, 'IBM Plex Sans Hebrew', system-ui, sans-serif;
        letter-spacing: -0.01em;
      }
      /* Held back 300 ms: a load faster than that shows nothing at all, and the
         app never waits for the animation to finish. */
      .il-bar { animation: il-bar 560ms cubic-bezier(0.23, 1, 0.32, 1) 300ms both; }
      .il-plate-in { animation: il-plate 460ms cubic-bezier(0.32, 0.72, 0, 1) 500ms both; }
      .il-plate-out { animation: il-plate 460ms cubic-bezier(0.32, 0.72, 0, 1) 580ms both; }
      .il-word { animation: il-word 600ms cubic-bezier(0.23, 1, 0.32, 1) 700ms both; }
      .il-sheen { animation: il-sheen 2400ms cubic-bezier(0.65, 0, 0.35, 1) 1240ms infinite both; }
      @keyframes il-bar { from { transform: scaleX(0); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes il-plate { from { transform: scaleY(0.3); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes il-word { from { opacity: 0; filter: blur(6px); transform: translateY(4px); } to { opacity: 1; filter: none; transform: none; } }
      /* The light crosses in the first half of each cycle, then rests. */
      @keyframes il-sheen { 0% { transform: translateX(-60px); } 55%, 100% { transform: translateX(120px); } }
      /* In-page loader: a hairline under the app's own header. */
      .il-track {
        position: relative; overflow: hidden;
        width: 56px; height: 2px; border-radius: 1px;
        background: #26262A;
        animation: il-fade 400ms cubic-bezier(0.23, 1, 0.32, 1) 160ms both;
      }
      .il-track::after {
        content: ''; position: absolute; inset: 0;
        width: 40%; border-radius: inherit;
        background: rgb(255 91 58);
        animation: il-glide 1400ms cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes il-fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes il-glide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @keyframes il-breathe { from { opacity: 0.45; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .il-bar, .il-plate-in, .il-plate-out, .il-word { animation: il-fade 400ms ease-out 300ms both; }
        .il-sheen { display: none; }
        .il-logo svg { animation: il-breathe 1400ms ease-in-out 600ms infinite alternate; }
        .il-track::after { width: 100%; animation: il-breathe 1200ms ease-in-out infinite alternate; }
        .il-splash.is-out .il-loader { transform: none; filter: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" class="il-splash" aria-hidden="true">
      <div class="il-loader">
        <div class="il-logo">
          <svg viewBox="0 0 100 48" fill="rgb(255 91 58)">
            <defs>
              <clipPath id="il-clip">
                <rect x="22" y="21.5" width="56" height="5" rx="2.5" />
                <rect x="15" y="7" width="9" height="34" rx="3" />
                <rect x="76" y="7" width="9" height="34" rx="3" />
                <rect x="7" y="13" width="6" height="22" rx="3" />
                <rect x="87" y="13" width="6" height="22" rx="3" />
              </clipPath>
              <linearGradient id="il-light" x1="0" x2="1" y1="0" y2="0">
                <stop offset="0" stop-color="#fff" stop-opacity="0" />
                <stop offset="0.5" stop-color="#fff" stop-opacity="0.55" />
                <stop offset="1" stop-color="#fff" stop-opacity="0" />
              </linearGradient>
            </defs>
            <rect class="il-bar" x="22" y="21.5" width="56" height="5" rx="2.5" />
            <rect class="il-plate-in" x="15" y="7" width="9" height="34" rx="3" />
            <rect class="il-plate-in" x="76" y="7" width="9" height="34" rx="3" />
            <rect class="il-plate-out" x="7" y="13" width="6" height="22" rx="3" />
            <rect class="il-plate-out" x="87" y="13" width="6" height="22" rx="3" />
            <g clip-path="url(#il-clip)">
              <rect class="il-sheen" x="0" y="0" width="28" height="48" fill="url(#il-light)" />
            </g>
          </svg>
          <div class="il-word">Ironlog</div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
